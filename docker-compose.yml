services:
  db:
    image: mysql:8.0
    container_name: fw2-mysql
    environment:
      MYSQL_DATABASE: todoapp2
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      TZ: Asia/Tokyo
    command: --default-time-zone=+09:00
    ports:
      - "3307:3306"
    volumes:
      - fw-db-data:/var/lib/mysql

volumes:
  fw-db-data:
    name: fw-db-data
