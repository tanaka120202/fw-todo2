spring.application.name=todoapp2
spring.datasource.url=jdbc:mysql://localhost:3307/todoapp2
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD:password}
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
spring.ai.mcp.server.protocol=STREAMABLE

todo.api.cors.allowed-origins=${TODO_API_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}

# Unhandled container errors never expose Boot's raw exception details.
server.error.include-stacktrace=never
server.error.include-message=never

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
todo.attachments.directory=${TODO_ATTACHMENTS_DIRECTORY:./uploads}
