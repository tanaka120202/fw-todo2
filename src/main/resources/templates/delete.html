<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{todo.confirm.delete}">削除確認</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container">
        <h1 class="page-title" th:text="#{todo.confirm.delete}">削除確認</h1>
        <p class="confirm-value"><span th:text="#{todo.title}">やること</span>：<span th:text="${todo.title}">やること</span></p>
        <p class="confirm-value"><span th:text="#{todo.category}">ジャンル</span>：<span th:text="${#messages.msgOrNull('category.' + todo.category) ?: (#messages.msgOrNull('category.' + todo.category) ?: todo.category)}">ジャンル</span></p>
        <p class="confirm-value"><span th:text="#{todo.due}">期限</span>：<span th:text="${todo.dueDate == null ? #messages.msg('value.none') : #temporals.format(todo.dueDate, 'yyyy-MM-dd')}">（入力なし）</span></p>
        <form th:action="@{/todos/{id}/delete(id=${todo.id})}" method="post">
            <div class="confirm-actions">
                <button class="btn" type="submit" th:text="#{action.remove}">消す</button>
                <a class="btn sub" href="/todos" th:href="@{/todos}" th:text="#{action.cancel}">やめる</a>
            </div>
        </form>
    </main>
</body>
</html>
