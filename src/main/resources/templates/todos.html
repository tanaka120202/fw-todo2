<!DOCTYPE html>
<html lang="ja" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{todo.list}">一覧</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container">
        <nav th:replace="~{language :: menu}"></nav>
        <p class="flash" th:if="${message != null}" th:text="#{${message}}">登録しました</p>
        <h1 class="page-title" th:text="#{todo.list}">一覧</h1>
        <a class="link" th:if="${admin}" th:href="@{/admin/users}" th:text="#{user.management}">ユーザー管理</a>
        <form th:action="@{/logout}" method="post">
            <button class="btn" type="submit" th:text="#{auth.logout}">ログアウト</button>
        </form>
        <form class="search-bar" action="/todos" th:action="@{/todos}" method="get">
            <label for="keyword"><span th:text="#{todo.title}">やること</span>
                <input class="form-input" type="text" id="keyword" name="keyword" th:value="${keyword}">
            </label>
            <label for="category"><span th:text="#{todo.category}">ジャンル</span>
                <select class="form-input" id="category" name="category">
                    <option value="" th:selected="${category == ''}" th:text="#{action.all}">すべて</option>
                    <option value="デザイン" th:selected="${category == 'デザイン'}" th:text="#{category.デザイン}">デザイン</option>
                    <option value="マーケティング" th:selected="${category == 'マーケティング'}" th:text="#{category.マーケティング}">マーケティング</option>
                    <option value="プログラミング" th:selected="${category == 'プログラミング'}" th:text="#{category.プログラミング}">プログラミング</option>
                    <option value="資格" th:selected="${category == '資格'}" th:text="#{category.資格}">資格</option>
                    <option value="就職活動" th:selected="${category == '就職活動'}" th:text="#{category.就職活動}">就職活動</option>
                </select>
            </label>
            <input type="hidden" name="order" th:value="${order}">
            <button class="btn" type="submit" th:text="#{action.filter}">絞り込む</button>
            <a class="link" th:href="@{/todos(keyword=${keyword},category=${category},order='asc')}" th:text="#{sort.asc}">期限が近い順</a>
            <a class="link" th:href="@{/todos(keyword=${keyword},category=${category},order='desc')}" th:text="#{sort.desc}">期限が遠い順</a>
        </form>
        <a class="btn" href="/todos/new" th:href="@{/todos/new}" th:text="#{todo.new}">新規登録</a>
        <a class="link" href="/calendar" th:href="@{/calendar}" th:text="#{calendar.link}">カレンダーで見る</a>
        <a class="link" th:href="@{/todos/report.csv(keyword=${keyword},category=${category},order=${order})}"
           th:text="#{todo.report}">CSVをダウンロード</a>
        <p th:if="${#lists.isEmpty(todos)}" th:text="#{todo.empty}">まだ1件も登録されていません</p>
        <form action="/todos/delete" th:action="@{/todos/delete}" method="post" onsubmit="return confirmSelectedDeletion();">
        <button class="btn" type="submit" th:text="#{todo.bulk.delete}">選択した項目を削除</button>
        <table class="todo-table" th:unless="${#lists.isEmpty(todos)}">
            <thead>
                <tr>
                    <th><input type="checkbox" id="select-all" th:aria-label="#{todo.select.all}"></th>
                    <th th:text="#{todo.title}">やること</th>
                    <th th:text="#{todo.category}">ジャンル</th>
                    <th th:text="#{todo.priority}">優先度</th>
                    <th th:text="#{todo.due}">期限</th>
                    <th th:text="#{todo.status}">状態</th>
                    <th th:text="#{action.actions}">操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="todo : ${todos}">
                    <td><input type="checkbox" name="ids" th:value="${todo.id}" class="todo-checkbox" th:aria-label="#{todo.select.one}"></td>
                    <td th:text="${todo.title}">やること</td>
                    <td th:text="${#messages.msgOrNull('category.' + todo.category) ?: (#messages.msgOrNull('category.' + todo.category) ?: todo.category)}">ジャンル</td>
                    <td th:text="${todo.priority == 1 ? #messages.msg('priority.high') : (todo.priority == 2 ? #messages.msg('priority.medium') : #messages.msg('priority.low'))}">中</td>
                    <td th:text="${todo.dueDate != null ? #temporals.format(todo.dueDate, 'yyyy-MM-dd') : #messages.msg('value.none')}">（入力なし）</td>
                    <td th:text="${todo.completed ? #messages.msg('todo.completed') : #messages.msg('todo.incomplete')}">未完了</td>
                    <td><a class="link" th:href="@{/todos/{id}/edit(id=${todo.id})}" th:text="#{todo.edit}">編集</a> <a class="link" th:href="@{/todos/{id}/delete(id=${todo.id})}" th:text="#{todo.delete}">削除</a></td>
                </tr>
            </tbody>
        </table>
        </form>
        <script th:inline="javascript">
            const selectAll = document.getElementById('select-all');
            const todoCheckboxes = document.querySelectorAll('.todo-checkbox');

            if (selectAll) {
                selectAll.addEventListener('change', () => {
                    todoCheckboxes.forEach((checkbox) => {
                        checkbox.checked = selectAll.checked;
                    });
                });
            }

            todoCheckboxes.forEach((checkbox) => {
                checkbox.addEventListener('change', () => {
                    if (selectAll) {
                        selectAll.checked = Array.from(todoCheckboxes).every((item) => item.checked);
                    }
                });
            });

            function confirmSelectedDeletion() {
                const selectedCount = Array.from(todoCheckboxes).filter((checkbox) => checkbox.checked).length;
                if (selectedCount === 0) {
                    alert(/*[[#{todo.select.required}]]*/ '');
                    return false;
                }
                return confirm(/*[[#{todo.bulk.confirm}]]*/ '');
            }
        </script>
    </main>
</body>
</html>
