<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一覧</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container">
        <p class="flash" th:if="${message != null}" th:text="${message}">登録しました</p>
        <h1 class="page-title">一覧</h1>
        <form class="search-bar" action="/todos" th:action="@{/todos}" method="get">
            <label for="keyword">やること
                <input class="form-input" type="text" id="keyword" name="keyword" th:value="${keyword}">
            </label>
            <label for="category">ジャンル
                <select class="form-input" id="category" name="category">
                    <option value="" th:selected="${category == ''}">すべて</option>
                    <option value="デザイン" th:selected="${category == 'デザイン'}">デザイン</option>
                    <option value="マーケティング" th:selected="${category == 'マーケティング'}">マーケティング</option>
                    <option value="プログラミング" th:selected="${category == 'プログラミング'}">プログラミング</option>
                    <option value="資格" th:selected="${category == '資格'}">資格</option>
                    <option value="就職活動" th:selected="${category == '就職活動'}">就職活動</option>
                </select>
            </label>
            <input type="hidden" name="order" th:value="${order}">
            <button class="btn" type="submit">絞り込む</button>
            <a class="link" th:href="@{/todos(keyword=${keyword},category=${category},order='asc')}">期限が近い順</a>
            <a class="link" th:href="@{/todos(keyword=${keyword},category=${category},order='desc')}">期限が遠い順</a>
        </form>
        <a class="btn" href="/todos/new" th:href="@{/todos/new}">新規登録</a>
        <p th:if="${#lists.isEmpty(todos)}">まだ1件も登録されていません</p>
        <form action="/todos/delete" th:action="@{/todos/delete}" method="post" onsubmit="return confirmSelectedDeletion();">
        <button class="btn" type="submit">選択した項目を削除</button>
        <table class="todo-table" th:unless="${#lists.isEmpty(todos)}">
            <thead>
                <tr>
                    <th><input type="checkbox" id="select-all" aria-label="全選択"></th>
                    <th>やること</th>
                    <th>ジャンル</th>
                    <th>優先度</th>
                    <th>期限</th>
                    <th>状態</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="todo : ${todos}">
                    <td><input type="checkbox" name="ids" th:value="${todo.id}" class="todo-checkbox" aria-label="この項目を選択"></td>
                    <td th:text="${todo.title}">やること</td>
                    <td th:text="${todo.category}">ジャンル</td>
                    <td th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}">中</td>
                    <td th:text="${todo.dueDate != null ? #temporals.format(todo.dueDate, 'yyyy-MM-dd') : '（入力なし）'}">（入力なし）</td>
                    <td th:text="${todo.completed ? '完了' : '未完了'}">未完了</td>
                    <td><a class="link" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a> <a class="link" th:href="@{/todos/{id}/delete(id=${todo.id})}">削除</a></td>
                </tr>
            </tbody>
        </table>
        </form>
        <script>
            const selectAll = document.getElementById('select-all');
            const todoCheckboxes = document.querySelectorAll('.todo-checkbox');

            if (selectAll) {
                selectAll.addEventListener('change', () => {
                    todoCheckboxes.forEach((checkbox) => {
                        checkbox.checked = selectAll.checked;
                    });
                });
            }

            todoCheckboxes.forEach((checkbox) => {
                checkbox.addEventListener('change', () => {
                    if (selectAll) {
                        selectAll.checked = Array.from(todoCheckboxes).every((item) => item.checked);
                    }
                });
            });

            function confirmSelectedDeletion() {
                const selectedCount = Array.from(todoCheckboxes).filter((checkbox) => checkbox.checked).length;
                if (selectedCount === 0) {
                    alert('削除する項目を選択してください');
                    return false;
                }
                return confirm('選択した項目を削除しますか？');
            }
        </script>
    </main>
</body>
</html>
